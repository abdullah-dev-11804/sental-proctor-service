services:
  redis:
    image: redis:7.4.5-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  livekit:
    image: livekit/livekit-server:v1.12.0
    command: --config /etc/livekit.yaml
    volumes:
      - ./infra/livekit.yaml:/etc/livekit.yaml:ro
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    ports:
      - "127.0.0.1:7880:7880"
      - "7881:7881"
      - "50000-50100:50000-50100/udp"
    depends_on:
      - redis
    restart: unless-stopped

  livekit-egress:
    image: livekit/egress:v1.13.0
    environment:
      EGRESS_CONFIG_FILE: /etc/egress.yaml
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
    volumes:
      - ./infra/egress.yaml:/etc/egress.yaml:ro
    depends_on:
      - redis
      - livekit
      - minio
    restart: unless-stopped

  api:
    build:
      context: ./apps/api
    env_file:
      - .env
    environment:
      LOCAL_STORAGE_ROOT: /app/storage
      IDENTITY_MODEL_ROOT: /app/models
      REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:8091:8091"
    volumes:
      - ./storage:/app/storage
      - ./models:/app/models:ro
    secrets:
      - reference_encryption_key
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ./apps/api
    command: python -m app.workers.main
    env_file:
      - .env
    environment:
      LOCAL_STORAGE_ROOT: /app/storage
      IDENTITY_MODEL_ROOT: /app/models
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./storage:/app/storage
      - ./models:/app/models:ro
    secrets:
      - reference_encryption_key
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_data:
  minio_data:

secrets:
  reference_encryption_key:
    file: ./secrets/reference_encryption_key
